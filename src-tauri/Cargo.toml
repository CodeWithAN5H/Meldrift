[package]
name = "meldrift"
version = "0.7.0-alpha.1"
description = "Meldrift — Your game. Everyone's turn."
authors = ["Meldrift"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meldrift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the frontend and serves it over Tauri's custom protocol in release
# builds. Without it, a release binary still points at devUrl (127.0.0.1:1420).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
