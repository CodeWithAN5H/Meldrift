[package]
name = "meldrift"
version = "0.3.0-alpha.1"
description = "Meldrift — Your game. Everyone's turn."
authors = ["Meldrift"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meldrift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
