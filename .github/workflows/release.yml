name: Release

# A tag push builds, tests and verifies the release, attaches the four
# verified assets to a DRAFT GitHub Release, and only then publishes that same
# draft. Nothing becomes public until every check and every upload has
# succeeded, and an alpha/beta tag is always published as a prerelease.
# A manual run with publish=false performs the whole build, signing, checksum
# and verification path without creating any release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v0.7.0-alpha.1)'
        required: true
        type: string
      publish:
        description: 'Publish a public release. Leave false to validate only.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish
    runs-on: windows-latest
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve and validate the release tag
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(alpha|beta)\.(0|[1-9]\d*))?$') {
            throw "Tag '$tag' is not a supported release tag (expected v<major>.<minor>.<patch>[-alpha.N|-beta.N])."
          }
          "MELDRIFT_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Release tag: $tag"
          Write-Output "Signing configured: $(-not [string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64))"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Check version consistency
        run: node scripts/check-version.mjs

      - name: Typecheck
        run: bun run typecheck

      - name: Frontend tests
        run: bun run test

      # The Rust crate embeds the sidecar through tauri.conf.json externalBin,
      # so the binary must exist before any cargo test/build. CI does the same.
      - name: Build signaling sidecar
        run: bun run server:build

      - name: Packaged sidecar lifecycle test
        run: bun run server:test:packaged

      - name: Server tests
        working-directory: server
        run: bun test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build application executable (no bundle yet)
        run: bun run tauri build --no-bundle

      - name: Decode signing certificate
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "meldrift-signing.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "SIGN_PFX_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign application executable
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign.ps1 -Path 'src-tauri/target/release/meldrift.exe' -Require

      - name: Bundle installer (unsigned build)
        if: env.SIGN_PFX_BASE64 == ''
        run: bun run tauri bundle --no-binary-patching --no-sign

      - name: Bundle installer with the signed executable
        if: env.SIGN_PFX_BASE64 != ''
        run: bun run tauri bundle --no-binary-patching --no-sign

      - name: Sign installer
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: ./scripts/sign.ps1 -Require

      - name: Record unsigned status explicitly
        if: env.SIGN_PFX_BASE64 == ''
        shell: pwsh
        run: ./scripts/sign.ps1

      - name: Package installer and checksum
        env:
          MELDRIFT_REQUIRE_SIGNING: ${{ secrets.SIGN_PFX_BASE64 != '' && '1' || '0' }}
        run: node scripts/package.mjs

      - name: Generate release notes
        run: node scripts/release-notes.mjs

      - name: Verify release assets
        env:
          MELDRIFT_REQUIRE_SIGNING: ${{ secrets.SIGN_PFX_BASE64 != '' && '1' || '0' }}
        run: node scripts/verify-release.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: meldrift-windows-installer
          path: |
            artifacts/Meldrift-Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-report.json
            artifacts/RELEASE_NOTES.md
          if-no-files-found: error

      # Phase 1: attach every verified asset to a draft. If any upload is
      # missing or fails, the job stops here and nothing is public.
      - name: Attach verified assets to a draft release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.MELDRIFT_TAG }}
          name: Meldrift ${{ env.MELDRIFT_TAG }}
          body_path: artifacts/RELEASE_NOTES.md
          draft: true
          prerelease: ${{ contains(env.MELDRIFT_TAG, 'alpha') || contains(env.MELDRIFT_TAG, 'beta') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Meldrift-Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-report.json
            artifacts/RELEASE_NOTES.md

      # Phase 2: publish the draft that already holds all four assets. A failed
      # upload above means this step never runs, so no incomplete release can
      # appear on the releases page.
      - name: Publish the verified release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.MELDRIFT_TAG }}
          name: Meldrift ${{ env.MELDRIFT_TAG }}
          body_path: artifacts/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(env.MELDRIFT_TAG, 'alpha') || contains(env.MELDRIFT_TAG, 'beta') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Meldrift-Setup.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-report.json
            artifacts/RELEASE_NOTES.md
